name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.12.12'
      - name: Check generated IERS data
        run: make check-generated
      - name: Check formatting
        run: make lint

  test:
    name: Test ${{ matrix.device }}
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        device: [fr255s, fr255, fr965]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up ConnectIQ SDK and simulator
        uses: DuckSoft/setup-connectiq-actions@v2
        with:
          sdk-version: '9.2.0'
          install-simulator-dependencies: 'true'
      - name: Create test developer key
        shell: bash
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out "$RUNNER_TEMP/test-key.pem"
          openssl pkcs8 -topk8 -inform PEM -outform DER -in "$RUNNER_TEMP/test-key.pem" -out "$RUNNER_TEMP/test-key.der" -nocrypt
      - name: Compile unit tests
        shell: bash
        run: >-
          monkeyc
          -t
          -d "${{ matrix.device }}"
          -f "monkey.jungle:test.jungle"
          -o "$RUNNER_TEMP/PolarFinder-tests-${{ matrix.device }}.prg"
          -y "$RUNNER_TEMP/test-key.der"
      - name: Run unit tests
        shell: bash
        run: bash tests/run-simulator-tests.sh "$RUNNER_TEMP/PolarFinder-tests-${{ matrix.device }}.prg" "${{ matrix.device }}"

  build:
    name: Build ${{ matrix.device }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        device: [fr255, fr255s, fr255m, fr255sm, fr965]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare signing key and output directory
        shell: bash
        env:
          CIQ_DEVELOPER_KEY: ${{ secrets.CIQ_DEVELOPER_KEY }}
        run: |
          umask 077
          key_file=$(mktemp --tmpdir="$GITHUB_WORKSPACE" --suffix=.der .ci-developer-key.XXXXXX)
          printf 'CIQ_KEY_PATH=%s\n' "${key_file#"$GITHUB_WORKSPACE/"}" >> "$GITHUB_ENV"
          chmod 600 "$key_file"
          printf '%s' "$CIQ_DEVELOPER_KEY" | base64 --decode > "$key_file"
          test -s "$key_file"
          mkdir -p bin
      - name: Compile PRG
        uses: blackshadev/garmin-connectiq-build-action@9.2.0
        with:
          developerKey: ${{ env.CIQ_KEY_PATH }}
          projectJungle: monkey.jungle
          typeCheck: '0'
          device: ${{ matrix.device }}
          outputPath: bin/PolarFinder-${{ matrix.device }}.prg
      - name: Remove signing key
        if: always()
        shell: bash
        run: |
          if [[ -n "${CIQ_KEY_PATH:-}" ]]; then
            rm -f -- "$GITHUB_WORKSPACE/$CIQ_KEY_PATH"
          fi
      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: PolarFinder-${{ matrix.device }}
          path: bin/PolarFinder-${{ matrix.device }}.prg
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4.1.3
        with:
          pattern: PolarFinder-*
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.prg \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes
