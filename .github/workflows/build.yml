name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate generated data and formatting
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install monkeyc-fmt
        run: cargo install --locked --version 0.1.1 monkeyc-fmt
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.12.12'
      - name: Check generated IERS data
        run: make check-generated
      - name: Check independent astrometry oracle
        run: make check-astrometry-regression
      - name: Check formatting
        run: make lint

  build:
    name: Build all devices and test all profiles
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install monkeyc-fmt
        run: cargo install --locked --version 0.1.1 monkeyc-fmt
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up ConnectIQ SDK and simulator
        uses: DuckSoft/setup-connectiq-actions@v2
        with:
          sdk-version: '9.2.0'
          install-simulator-dependencies: 'true'
      - name: Prepare signing key and output directory
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          CIQ_DEVELOPER_KEY: ${{ secrets.CIQ_DEVELOPER_KEY }}
        run: |
          umask 077
          key_file=$(mktemp --tmpdir="$GITHUB_WORKSPACE" --suffix=.der .ci-developer-key.XXXXXX)
          printf 'CIQ_KEY_PATH=%s\n' "${key_file#"$GITHUB_WORKSPACE/"}" >> "$GITHUB_ENV"
          chmod 600 "$key_file"
          printf '%s' "$CIQ_DEVELOPER_KEY" | base64 --decode > "$key_file"
          test -s "$key_file"
          mkdir -p bin
      - name: Compile PRGs
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          jobs=$(( $(nproc) / 2 ))
          if (( jobs < 1 )); then jobs=1; fi
          make -j"$jobs" SDK_HOME="$CONNECT_IQ_HOME" \
            DEVELOPER_KEY="$GITHUB_WORKSPACE/$CIQ_KEY_PATH" \
            build-all
      - name: Remove signing key
        if: always()
        shell: bash
        run: |
          if [[ -n "${CIQ_KEY_PATH:-}" ]]; then
            rm -f -- "$GITHUB_WORKSPACE/$CIQ_KEY_PATH"
          fi
      - name: Create test developer key
        shell: bash
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out "$RUNNER_TEMP/test-key.pem"
          openssl pkcs8 -topk8 -inform PEM -outform DER -in "$RUNNER_TEMP/test-key.pem" -out "$RUNNER_TEMP/test-key.der" -nocrypt
      - name: Run unit tests for all profiles
        shell: bash
        run: |
          bash tests/run-simulator-tests.sh \
            make SHELL=bash SDK_HOME="$CONNECT_IQ_HOME" \
            DEVELOPER_KEY="$RUNNER_TEMP/test-key.der" \
            ICONS= test-profiles
      - name: Upload all device PRGs
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v7
        with:
          name: PolarFinder-all-devices
          path: bin/*/PolarFinder-*.prg
          if-no-files-found: error
          retention-days: 14
